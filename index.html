<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Classes and IDs</title>
</head>
<body>
  <main>
    <h1>HTML Classes and IDs</h1>
    <p>This page shows two groups of buttons and links.</p>

    <!-- The class names identify each group of related elements. -->
    <section class="button-group">
      <!-- Each ID is a unique name for one element. -->
      <button id="one" type="button">First button</button>
      <button id="two" type="button">Second button</button>
    </section>

    <!-- This class identifies the group of links. -->
    <section class="link-group">
      <!-- The href attribute tells the browser where each link goes. -->
      <a id="three" href="../">Go to the home page</a>
      <a id="four" href="https://www.wikipedia.org/">Visit Wikipedia</a>
    </section>
  </main>
</body>
</html>
